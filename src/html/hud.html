<!-- El lienzo 3D (#view) y el HUD de la partida: panel de misión arriba, cámara a la derecha,
     órdenes y fichas abajo. Los textos van en español; i18n/i18n.js los traduce al vuelo. -->
<canvas id="view"></canvas>
<div id="hud">
  <header id="top">
    <div class="mission" role="button" tabindex="0" aria-expanded="false" title="Ver subobjetivos">
      <span class="eyebrow">Misión</span>
      <i class="chev mchev" aria-hidden="true"></i>
      <div class="mrow"><span id="clock">15:42:00</span><span id="obj"></span></div>
      <ol id="subs"></ol>
      <span id="tally">Escuadra 6/6 · Abatidos 0</span>
    </div>
  </header>
  <div id="log" hidden></div>
  <div id="camctl">
    <button id="bMenu" class="tiny" title="Menú (Esc)" aria-label="Menú"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
    <button id="bPause" class="tiny" title="Pausa táctica (Espacio)" aria-label="Pausa"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5v14M15 5v14"/></svg></button>
    <button id="bMap" hidden class="tiny" title="Mapa de la ciudad y la región (N)" aria-label="Mapa"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
    <button id="bAuto" class="tiny txt" aria-pressed="true" title="Pausa automática con contacto, bajas, refuerzos y objetivos nuevos">Auto</button>
    <button id="bSpeed" class="tiny txt" title="Velocidad">1×</button>
    <button id="bSound" class="tiny" title="Sonido" aria-label="Sonido"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 9a4 4 0 010 6M18.5 6.5a7.5 7.5 0 010 11"/></svg></button>
    <span class="csep" aria-hidden="true"></span>
    <button id="cRotL" title="Girar (Q)">&#10226;</button>
    <button id="cRotR" title="Girar (E)">&#10227;</button>
    <button id="cTiltU" class="tilt" title="Más vertical (RePág)" aria-label="Inclinar la cámara hacia arriba, hasta la vista cenital"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M5 20L10 5"/><path d="M13 20a8 8 0 00-5.4-7.6"/><path d="M15 8l3-3 3 3M18 5v8"/></svg></button>
    <span id="cTiltV" role="button" tabindex="0" title="Ángulo de la cámara">37°</span>
    <button id="cTiltD" class="tilt" title="Más bajo, hacia el horizonte (AvPág)" aria-label="Inclinar la cámara hacia abajo, hacia el horizonte"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 20h18"/><path d="M5 20L17 14"/><path d="M13 20a8 8 0 00-1.2-4.2"/><path d="M15 5l3 3 3-3M18 8V1"/></svg></button>
    <span class="csep" aria-hidden="true"></span>
    <button id="cZin" title="Acercar">+</button>
    <button id="cZout" title="Alejar">&minus;</button>
    <button id="cMap" title="Mapa táctico (N)" aria-label="Mapa táctico"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z"/><path d="M9 4v14M15 6v14"/></svg></button>
  </div>
  <footer id="bottom">
    <span id="hint"></span>
    <div id="orders">
      <button id="oChain" aria-pressed="true" title="Ruta: toca el suelo punto a punto (M)" aria-label="Ruta: toca el suelo punto a punto (M)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5" cy="18" r="2"/><circle cx="12" cy="8" r="2"/><circle cx="19" cy="16" r="2"/><path d="M6.4 16.4l4.3-6.6M13.5 9.5l4.2 5"/></svg></button>

      <button id="oAtk" aria-pressed="false" title="Atacar (A)" aria-label="Atacar (A)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="7"/><path d="M12 2v5M12 17v5M2 12h5M17 12h5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg></button>
      <button id="oSup" aria-pressed="false" title="Fuego de supresión (S)" aria-label="Fuego de supresión (S)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h4M3 7l4 2M3 17l4-2"/><path d="M10 12h11M10 7.5l11-2.5M10 16.5l11 2.5" stroke-dasharray="2 2.4"/></svg></button>
      <button id="oCov" title="Buscar cobertura (C)" aria-label="Buscar cobertura (C)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l7 3v5c0 5-3 8-7 10-4-2-7-5-7-10V6z"/><path d="M8 12h8"/></svg></button>
      <button id="oStop" title="Alto (X)" aria-label="Alto (X)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3h8l5 5v8l-5 5H8l-5-5V8z"/><path d="M8.5 12h7"/></svg></button>
      <div id="supWrap"><button id="oSupport" class="sup" title="Apoyo: Little Bird, bengalas, visores" aria-label="Apoyo: Little Bird, bengalas, visores"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v4"/><circle cx="12" cy="12" r="5"/><path d="M12 9v6M9 12h6"/><path d="M5 19h14"/><path d="M8 19l1.5-3M16 19l-1.5-3"/></svg></button><div id="supMenu" hidden><button id="oLB" class="sup" aria-pressed="false" title="Pasada de Little Bird (L)" aria-label="Pasada de Little Bird (L)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 7h18"/><path d="M12 7v3"/><path d="M6 13c0-1.7 2.3-3 5-3h2c2.2 0 4 1.3 4 3s-1.8 3-4 3H9"/><path d="M17 13h4l1-2"/><path d="M8 19h8M9 16v3M15 16v3"/></svg><span>Little Bird</span><em>×3</em></button><button id="oFlr" class="sup" aria-pressed="false" title="Bengala de iluminación, solo de noche (F)" aria-label="Bengala de iluminación, solo de noche (F)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 2v6M12 16v6M2 12h6M16 12h6M5 5l4 4M15 15l4 4M19 5l-4 4M9 15l-4 4"/><circle cx="12" cy="12" r="2"/></svg><span>Bengala</span><em>×4</em></button><button id="oNV" aria-pressed="false" title="Visores nocturnos de Delta (V)" aria-label="Visores nocturnos de Delta (V)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="9" width="7" height="7" rx="2"/><rect x="14" y="9" width="7" height="7" rx="2"/><path d="M10 12h4M7 9V6h10v3"/></svg><span>Visor NV</span></button></div></div>
      <button id="oMed" aria-pressed="false" title="Atender a los heridos (H)" aria-label="Atender a los heridos (H)"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="3.5" width="17" height="17" rx="2.5"/><path d="M12 7.5v9M7.5 12h9"/></svg></button>
    </div>
    <div id="cpToast">Punto de control</div><div id="squad"></div>
  </footer>
</div>
<div id="ctx" hidden></div>
